[project]
name = "x-post-app"
version = "0.1.0"
description = "Collect web/AI trends, generate Japanese X posts with Gemini, approve via GitHub Issue, and publish to X."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "PyYAML>=6.0.2",
    "google-genai>=1.0.0",
    "tweepy>=4.14.0",
    "PyGithub>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
