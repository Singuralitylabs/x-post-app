name: Publish approved post

on:
  issues:
    types: [labeled]

permissions:
  contents: write   # state/seen.json をコミットするため
  issues: write     # コメント・ラベル更新・クローズのため

concurrency:
  group: x-post-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    # `approved` ラベルが付いた時だけ実行
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/run_publish.py

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase --autostash || true
            git add state/seen.json
            git commit -m "chore: record posted state [skip ci]"
            git push
          else
            echo "no state changes"
          fi
